제목: 설문은 묻는 말에 따라 답이 달라질까?

그림: 같은 주제의 질문지 두 장을 비교하는 모습
기자의 말: 처음에는 응답 수만 보았다. 이제는 무엇을 어떻게 물었는지도 확인하려 한다.

## 질문을 좁혀 보기
학교 생활에 관한 설문을 만든다고 해 보자. 쉬는 시간을 늘리는 데 찬성하느냐고 묻는 문항과 수업 시간이 줄어도 괜찮으냐고 묻는 문항은 같은 선택을 다르게 느끼게 한다. 첫 문장은 얻는 시간을, 둘째 문장은 줄어드는 시간을 앞세운다. 실제 응답을 모으지 않았으므로 어느 쪽의 찬성이 더 많다고 말할 수는 없다. 다만 두 문장이 같은 대상을 같은 방식으로 묻는지 점검할 이유는 충분하다. 설문을 읽는 일도 질문에서 시작된다.
설문 응답은 머릿속 의견을 그대로 꺼내 담은 숫자라고 보기 어렵다. 응답자는 질문의 단어를 해석하고 관련 경험을 떠올린 뒤 보기 중 하나를 고른다. 같은 주제라도 어떤 단어를 쓰고 어떤 정보를 앞에 두느냐에 따라 답이 달라질 수 있다. 조사 기관은 그래서 문항의 정확한 표현과 질문 순서를 함께 공개한다. 결과 숫자만 읽으면 응답자가 실제로 무엇에 답했는지 놓치기 쉽다. 질문지 원문도 조사 결과의 일부로 읽어야 한다.[1]
한 문항에서 두 가지를 동시에 물으면 답을 해석하기 곤란해진다. 급식과 도서관 운영에 만족하느냐고 한꺼번에 묻는 경우를 생각해 보자. 급식에는 만족하지만 도서관에는 불만이 있는 사람은 어느 보기를 골라야 할까? 이런 문항은 두 질문으로 나누는 편이 낫다. 응답자가 성실하게 답해도 질문 자체가 여러 뜻을 묶으면 조사자는 무엇에 대한 답인지 구별하기 어렵다. 문장을 짧게 만드는 일과 질문을 하나로 좁히는 일은 다르다.[1]
## 설명과 자료를 살피기
좋은 응답 보기에는 질문에 맞는 선택지가 필요하다. 이용 횟수를 묻는다면 기간을 정하고 경계가 겹치지 않게 해야 한다. 자주와 가끔 같은 말만 두면 사람마다 기준을 다르게 잡을 수 있다. 기억나지 않거나 해당하지 않는 상황도 검토할 필요가 있다. 그렇다고 모든 문항에 같은 보기를 기계적으로 붙일 수는 없다. 조사하려는 경험이 무엇인지 정한 뒤, 사람들이 자기 상황을 무리 없이 표시할 수 있는지 실제로 읽어 보며 확인한다.[2]
> 답을 읽기 전에 질문의 조건부터 살펴보자.
질문을 놓는 순서도 응답에 영향을 줄 수 있다. 앞에서 특정 문제를 자세히 생각하게 한 뒤 전반적인 만족도를 물으면 그 문제가 더 쉽게 떠오를 수 있다. 조사 기관은 이런 순서 효과를 줄이거나 살피려고 일부 질문이나 보기의 순서를 무작위로 바꾼다. 무작위화는 모든 영향을 없애는 마법이 아니다. 특정 위치가 늘 같은 항목에 배정되는 일을 피하고, 서로 다른 순서의 응답을 비교할 수 있게 하는 조사 설계의 한 방법이다.[1]
그림: 기사에서 설명한 관계를 나타낼 본문 그림
질문의 효과를 직접 알아보려면 비교할 조건을 분명히 해야 한다. 한 설문에는 원래 문장을, 다른 설문에는 바꾼 문장을 넣고 나머지 조건을 최대한 같게 두는 방법을 생각할 수 있다. 참여자를 어느 설문에 배정하는지도 결과 해석에 관여한다. 두 집단의 응답이 다르더라도 문장 외의 조건이 함께 달랐다면 원인을 바로 단정하기 어렵다. 문장 하나를 바꿨다는 기록만으로 충분한 실험이 되지는 않는다.[3]
응답자가 많다는 이유만으로 결과가 전체 학생의 생각을 대표하지는 않는다. 누구에게 참여 기회가 있었고 누가 실제로 답했는지 살펴야 한다. 특정 모임에만 링크를 나눠 주면 다른 생활을 하는 학생의 의견은 빠질 수 있다. 표본의 수와 표본을 모은 방법은 서로 다른 정보다. 설문을 소개할 때는 조사 대상, 모집 방식, 조사 시기와 문항을 함께 적는 편이 좋다. 그래야 독자가 결과를 어디까지 적용할 수 있을지 판단할 수 있다.[2]
## 다시 생활 속으로
학교 잡지에서 가상의 설문 문항을 다루는 경우에는 실제 조사 결과와 구분해 표시해야 한다. 예시 문장을 만들었다고 해서 학생들이 실제로 그렇게 답한 것은 아니다. 숫자가 필요하다는 이유로 비율을 만들어 붙이면 질문의 효과를 설명하는 글이 거짓 조사 보고서가 된다. 이 기사에는 응답 수나 찬성률을 넣지 않았다. 대신 어떤 말이 응답자의 주의를 끌 수 있는지 살펴보고, 확인하려면 어떤 비교가 필요한지를 제안한다.
다른 시기의 설문과 결과를 비교할 때도 질문지부터 살펴보자. 주제가 같더라도 문항 표현, 조사 방식이나 질문 순서가 바뀌면 단순한 변화량으로 읽기 어렵다. 전화로 답하는 상황과 혼자 화면을 보며 답하는 상황도 같지 않을 수 있다. 조사 기관이 이런 차이를 어떻게 설명했는지 확인하는 일이 먼저다. 숫자의 차이가 곧 생각의 변화라고 말하기 전에, 숫자를 얻는 과정에서 바뀐 조건이 있는지 찾아보는 것이다.[2]
다음 설문을 읽을 때는 결과 제목 옆에 작은 질문지를 그려 보고 싶다. 누구에게, 언제, 어떤 말로 물었는지를 차례로 적는 칸이다. 답을 고르기 전에 뜻이 모호한 단어에 표시하고 한 문항에 두 판단이 묶였는지도 살펴보면 좋겠다. 다른 사람에게 같은 문장을 읽어 달라고 부탁하면 내가 예상하지 못한 해석을 들을 수도 있다. 설문을 의심하기만 하려는 것은 아니다. 질문과 답 사이의 과정을 보면서 결과를 더 정확하게 이해하려는 연습이다.

[상자] 읽기 전에
- 이 글은 공개 자료를 읽고 쓴 예시 기사입니다.
- 실제 조사나 현장 관측 결과를 제시하지 않습니다.

## 질문을 좁혀 보기
여름에는 해가 높이 떠 있고 겨울에는 해가 일찍 진다. 이 차이를 태양과 지구 사이의 거리로 설명하면 어떨까? 가까우면 덥고 멀면 춥다는 생각은 일상 경험과 잘 맞는다. 하지만 같은 날 북반구가 여름일 때 남반구는 겨울이다. 두 반구는 같은 지구에 붙어 있으므로 태양까지의 거리가 거의 같다. 계절을 설명하려면 거리만 보는 대신 햇빛이 어느 방향에서 얼마나 오래 들어오는지 함께 살펴봐야 한다.[1]
지구의 자전축은 북극과 남극을 잇는 가상의 선이다. 지구는 이 축을 중심으로 돌면서 낮과 밤을 만든다. 자전축은 공전 궤도면에 수직인 방향에서 약 23.5도 기울어져 있다. 지구가 태양 주위를 한 바퀴 도는 동안 축의 방향은 대체로 유지된다. 이 때문에 공전 궤도의 어느 위치에 있느냐에 따라 햇빛을 더 정면으로 받는 반구가 달라진다. 축이 매 계절마다 반대로 쓰러지는 것은 아니다.[2]
북반구가 태양 쪽으로 기울어진 시기에는 북반구의 여름이 온다. 한낮의 태양이 더 높이 보이고 낮도 길어진다. 같은 넓이의 땅에 햇빛이 더 집중되고 햇빛을 받는 시간도 늘어난다. 남반구는 그때 태양 반대쪽으로 기울어 겨울을 맞는다. 반년 뒤에는 두 반구의 상황이 바뀐다. 이 설명은 한 지역의 기온만 다루지 않고 서로 반대인 두 반구의 계절을 함께 설명한다는 장점이 있다.[1]
## 설명과 자료를 살피기
손전등과 종이로 햇빛의 입사각을 흉내 낼 수 있다. 빛을 종이에 수직으로 비추면 밝은 영역이 비교적 좁다. 같은 거리에서 종이를 기울이면 그 영역이 넓어진다. 비슷한 양의 빛이 더 넓은 면적에 퍼지므로 단위 면적이 받는 에너지는 줄어든다. 다만 손전등 빛은 태양빛처럼 거의 평행하지 않다. 이 모형은 면적과 각도의 관계를 보여 주는 도구이며 실제 계절의 온도까지 그대로 재현하지는 못한다.[2]
> 같은 빛도 비추는 각도에 따라 다른 넓이에 퍼진다.
계절을 조사할 때는 한낮의 높이와 하루의 낮 길이를 구별해서 기록하면 좋다. 해가 높이 뜨는지 보려면 같은 장소에서 같은 시각의 그림자 길이를 비교할 수 있다. 낮 길이는 일출과 일몰 시각의 차이로 살펴본다. 하루의 관찰만으로 일 년의 변화를 단정할 수는 없다. 날짜와 구름 상태를 함께 적고 여러 시기의 기록을 모으면, 날씨 때문에 생긴 짧은 변화와 계절에 따른 긴 변화를 나누어 생각하기 쉽다.

춘분과 추분 무렵에는 낮과 밤의 길이가 대체로 비슷해진다. 그러나 실제 일출과 일몰로 잰 낮이 모든 곳에서 정확히 열두 시간인 것은 아니다. 태양은 점이 아니라 둥근 원반처럼 보이고 대기도 빛을 굴절시킨다. 일출은 원반의 윗부분이 보이기 시작할 때로 정하므로 단순한 그림의 경계와 차이가 난다. 교과서의 모형을 관측 기록과 비교할 때는 모형에서 생략한 조건과 관측의 정의도 확인해야 한다.[2]

여름의 낮이 길다고 해서 그날그날 반드시 더운 것은 아니다. 구름, 비, 바람과 바다의 영향도 기온에 관여한다. 자전축 모형은 계절에 따라 태양 에너지를 받는 조건이 어떻게 달라지는지 설명한다. 내일의 기온을 알려면 그날의 대기 상태에 관한 자료도 필요하다. 질문의 시간 범위를 하루로 잡는지 일 년으로 잡는지에 따라 살펴볼 자료가 달라지는 셈이다. 한 설명이 답하는 범위를 제목에 드러내면 혼동을 줄일 수 있다.
그림을 그릴 때는 두 위치의 지구에서 자전축을 같은 방향으로 그려야 한다. 태양을 향하도록 축을 매번 돌려 그리면 계절이 바뀌는 까닭을 오히려 가린다. 공전 궤도를 지나치게 납작하게 그리는 것도 거리의 효과를 실제보다 크게 보이게 한다. 모형에서 무엇을 강조하고 무엇을 줄였는지 설명을 붙여 보자. 그림이 보기 좋은지만 확인하는 대신, 그림을 본 사람이 어떤 원인을 떠올릴지도 함께 살피는 것이다.

## 설명과 자료를 살피기
출처 표시는 읽은 주소를 길게 나열하는 일에서 끝나지 않는다. 어떤 문장을 어느 자료로 확인했는지 연결해야 독자도 다시 찾아볼 수 있다. 기관의 이름과 자료 제목을 적고 실제로 그 내용이 있는지 본문을 읽어 보려 한다. 검색 결과의 짧은 설명만 보고 전체 주장을 확인했다고 쓰지는 않겠다. 자료가 다루는 대상과 시기가 내 문장의 범위에 맞는지도 살펴볼 생각이다. 주소가 열리는지와 주장을 뒷받침하는지는 따로 확인할 일이다.
사람의 생각을 다루는 기사에서도 근거를 얻는 방법이 중요하다. 설문 숫자를 소개한다면 누가 어떤 말에 답했는지 함께 읽어야 한다. 자연 현상을 다룰 때는 관찰 장소와 측정 조건을 살핀다. 질문의 대상이 달라지면 쓰는 도구와 자료도 달라지지만, 독자가 확인할 수 있게 방법을 남긴다는 약속은 같다. 서로 다른 꼭지를 한 권에 모은 까닭도 이 약속을 여러 장면에서 살펴보기 위해서다. 한 방식만 모든 질문에 억지로 맞추지는 않으려 한다.
AI는 검색어를 떠올리거나 어려운 용어를 풀어 읽을 때 도움을 줄 수 있다. 그러나 매끄러운 문장이 나왔다는 이유만으로 사실 확인이 끝난 것은 아니다. 제목과 주소가 실제 자료와 맞는지, 숫자가 원문에 있는지 직접 대조해야 한다. 이 잡지의 예시 글은 확인한 공개 자료와 설명을 위한 상황을 구별해 썼다. 실제로 설문을 하거나 현장 실험을 한 것처럼 꾸미지 않았다. 해 보지 않은 관찰을 해 본 일처럼 쓰는 순간 독자가 판단할 근거가 흐려지기 때문이다.
그림도 본문처럼 확인할 내용을 가진다. 지구의 자전축을 그린다면 두 위치에서 축의 방향이 어떻게 이어지는지 살펴야 한다. 화살표의 굵기가 양을 뜻하는지 단순히 방향만 뜻하는지도 설명하면 좋다. 빈 그림 자리는 나중에 아무 장식이나 채우는 칸으로 남기지 않으려 한다. 그 위치에서 독자가 이해해야 할 관계를 먼저 한 줄로 적어 두면 그림을 고르는 기준이 된다. 보기 좋은 그림과 질문에 답하는 그림이 늘 같은 것은 아니다.
## 다시 생활 속으로
취재 노트에는 처음 질문과 바뀐 질문을 나란히 남긴다. 결과를 다 안 뒤에 처음부터 정확한 질문을 했던 것처럼 꾸미지 않기 위해서다. 자료를 읽다가 범위를 줄였거나 예외를 발견했다면 그 변화도 짧게 적을 수 있다. AI를 어느 부분에 썼는지도 함께 밝히려 한다. 누가 어떤 판단을 했는지 보이면 독자는 완성된 문장뿐 아니라 문장을 만드는 과정도 살펴볼 수 있다. 노트가 길어질 필요는 없지만 실제로 한 일과 맞아야 한다.
독자는 기사의 마지막 문장을 그대로 받아들이는 사람으로만 남지 않았으면 한다. 설명이 잘 맞지 않는 경험을 떠올리거나 출처에서 다른 조건을 찾았다면 질문함에 남겨 주면 좋겠다. 과학 지식은 새로운 근거가 있을 때 다시 검토할 수 있고 탐구는 다른 사람과의 대화 속에서도 진행된다. 잘못된 문장을 발견하면 근거와 함께 고치는 과정까지 다음 글에 담으려 한다. 질문을 모으는 일에는 답을 내놓은 뒤 다시 읽는 시간도 필요하다.[1]
이제 차례에서 마음에 걸리는 질문 하나를 골라 읽어 보자. 모든 기사를 처음부터 순서대로 읽지 않아도 된다. 제목을 보고 예상한 답을 잠시 떠올린 다음 본문에서 그 생각이 어떻게 달라지는지 살피면 좋겠다. 출처 번호와 취재 노트는 읽기를 멈추게 하는 장식이 아니라 더 확인하고 싶은 곳으로 가는 표시다. 책을 덮을 때 정답 하나보다 새로 확인할 질문 하나가 남아도 좋겠다. 다음 호의 첫 문장은 독자가 남긴 그 질문에서 시작될 수 있다.
